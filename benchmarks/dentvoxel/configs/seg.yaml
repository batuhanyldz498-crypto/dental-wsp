task: dentvoxel_seg
dataset: dentvoxel
track: seg
architecture: cbct-wsp82-v1
protocol:
  canvas: [96, 128, 128]
  intensity_normalization: hu_window_-1000_3000_with_audit_gate
  target: 3d_natural_tooth_union_fdi_11_48
  threshold_logit: 0.0
  scan_split: [60, 20, 20]
  label_budgets_k: [1, 2, 4, 8, 16, 32, 60]
  seeds: [0, 1, 2, 3, 4]
  adam_lr: 0.01
  adam_epochs: 150
  arms: [frozen_wsp, random_init_adam, wsp_warmstart_adam, trained_position_only]
  test_sealed: true
scientific_sources:
  - name: Weight-Space Programming for Medical Imaging
    url: https://arxiv.org/abs/2611.12066
  - name: DentVoxel 38-Structure Dental CBCT Dataset (Figshare)
    url: https://figshare.com/articles/dataset/DentVoxel_a_fully_annotated_dental_CBCT_dataset_with_38_instance_anatomical_structures/31239889
