task: akudental_seg
dataset: akudental
track: seg
architecture: pano-wsp82-v1
protocol:
  canvas: [384, 768]
  intensity_normalization: percentile_0.5_99.5
  target: natural_tooth_union_fdi_11_48
  threshold_logit: 0.0
  label_budgets_k: [1, 2, 4, 8, 16, 32, 64]
  seeds: [0, 1, 2, 3, 4]
  adam_lr: 0.01
  adam_epochs: 200
  arms: [frozen_wsp, random_init_adam, wsp_warmstart_adam, trained_position_only]
  test_sealed: true
scientific_sources:
  - name: Weight-Space Programming for Medical Imaging
    url: https://arxiv.org/abs/2611.12066
  - name: AKUDENTAL Panoramic Dataset
    url: https://doi.org/10.1186/s12903-025-07645-0
