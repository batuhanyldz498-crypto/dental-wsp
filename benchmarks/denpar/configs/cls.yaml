task: denpar_cls
dataset: denpar
track: cls
architecture: cls-lenet2d-v1
protocol:
  canvas: [64, 64]
  intensity_normalization: percentile_0.5_99.5
  target: arch_upper_vs_lower
  official_splits:
    train: 650
    val: 150
    test: 200
  threshold_logit: 0.0
  label_budgets_k: [2, 4, 8, 16, 32, 64, 128]
  seeds: [0, 1, 2, 3, 4]
  adam_lr: 0.005
  adam_epochs: 200
  arms: [frozen_wsp, random_init_adam, wsp_warmstart_adam]
  test_sealed: true
scientific_sources:
  - name: Weight-Space Programming for Medical Imaging
    url: https://arxiv.org/abs/2611.12066
  - name: DenPAR Annotated Intra-Oral Periapical Radiographs Dataset (Scientific Data, 2025)
    url: https://zenodo.org
