name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,nifti]"
      - name: Run unit tests and repository hygiene checks
        run: pytest -v
      - name: Verify design locks across all six benchmark tasks
        run: |
          for task in akudental_seg akudental_cls denpar_seg denpar_cls dentvoxel_seg dentvoxel_cls; do
            dental-wsp lock-design "$task" --check-only
          done
